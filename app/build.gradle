plugins {
    id 'com.android.application' version '8.6.0'
    id 'com.google.gms.google-services' version '4.4.2'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
// Also accept app/local.properties. The module file wins when both exist,
// preventing an old root key from silently being packaged into a new APK.
def modulePropertiesFile = project.file("local.properties")
if (modulePropertiesFile.exists()) {
    modulePropertiesFile.withInputStream { localProperties.load(it) }
}
// The Render URL is public and safe to include in the APK. The ZapUPI key
// remains server-side and is never read by this Android build.
def defaultBackendBaseUrl = "https://starx24-backend-1.onrender.com"
def backendBaseUrl = localProperties.getProperty("backend.base.url", defaultBackendBaseUrl).trim()
if (project.hasProperty("backend.base.url")) {
    backendBaseUrl = project.property("backend.base.url").toString().trim()
}
if (backendBaseUrl.isEmpty() || backendBaseUrl.contains("YOUR-SERVICE")) {
    backendBaseUrl = defaultBackendBaseUrl
}
// Remote maintenance is opt-in so a stale Firebase flag cannot affect a new APK.
def remoteMaintenanceEnabled = localProperties.getProperty("remote.maintenance.enabled", "false")

android {
    namespace 'com.arenax.tournament'
    compileSdk 35

    defaultConfig {
        // This is only the public Render API URL. Never put a payment key in the APK.
        buildConfigField "String", "STARX_API_BASE_URL", "\"${backendBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "boolean", "REMOTE_MAINTENANCE_ENABLED", remoteMaintenanceEnabled
        applicationId 'com.arenax.tournament'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions += "role"
    productFlavors {
        user {
            dimension "role"
            applicationId "com.tournament.user"
            versionNameSuffix "-user"
        }
        paymentAdmin {
            dimension "role"
            applicationId "com.tournament.payment"
            versionNameSuffix "-payment-admin"
        }
        matchAdmin {
            dimension "role"
            applicationId "com.tournament.match"
            versionNameSuffix "-match-admin"
        }
        masterControl {
            dimension "role"
            applicationId "com.tournament.admin"
            versionNameSuffix "-master-control"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.browser:browser:1.8.0'

    // OkHttp is used for the private Render API and admin provisioning/notification calls.
    // Firebase Admin/FCM credentials remain server-side and are never packaged in the APK.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
